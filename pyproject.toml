[project]
name = "wsp"
version = "0.1.0"
description = "Weight-space programming: compose model components into one model"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "safetensors",
    "torch",
    "zstandard",
]

[project.scripts]
sapien = "wsp.cli:main"

[project.optional-dependencies]
compile = ["transformers==5.23.0", "accelerate", "huggingface_hub"]
dev = ["pytest"]
# Person B: eval harness, probe/overlap tools, interp agent. Add vllm on GPU machines.
eval = ["transformers>=4.45", "huggingface_hub", "datasets", "matplotlib"]
# Part 3: env, swarm agents, literature, Modal backend.
swarm = ["anthropic", "openai", "exa_py", "httpx", "requests", "modal", "matplotlib"]
# Studio: the web app server (studio/server).
studio = ["fastapi", "uvicorn[standard]", "python-multipart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp", "wsp_eval"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
